<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ContextVault</title>
<style>
  :root { color-scheme: dark light; }
  body {
    width: 300px;
    margin: 0;
    padding: 14px 16px 16px;
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: #1b1e24;
    color: #f2f4f7;
  }
  h1 { margin: 0 0 2px; font-size: 15px; }
  .sub { margin: 0 0 14px; font-size: 12.5px; color: #99a1ae; }
  .row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; padding: 9px 0; border-top: 1px solid #2c313a;
  }
  .row:first-of-type { border-top: 0; }
  .row label { flex: 1; cursor: pointer; }
  .row .note { display: block; font-size: 11.5px; color: #99a1ae; }
  input[type=checkbox] { width: 17px; height: 17px; accent-color: #7c9cff; }
  button {
    width: 100%; margin-top: 12px; padding: 9px 12px;
    font: inherit; font-weight: 620; font-size: 13.5px;
    border-radius: 9px; border: 1px solid #3a3f48;
    background: #23262d; color: #f2f4f7; cursor: pointer;
  }
  button.primary { background: #7c9cff; color: #12151b; border-color: transparent; }
  button:hover { filter: brightness(1.08); }
  #status {
    margin-top: 12px; font-size: 12.5px; color: #99a1ae; min-height: 17px;
  }
  #status[data-tone="ok"] { color: #7fc39c; }
  #status[data-tone="bad"] { color: #e0716b; }
  .soon { font-size: 11.5px; color: #7e8695; }
  @media (prefers-color-scheme: light) {
    body { background: #fff; color: #14171c; }
    .row { border-color: #e6e9ee; }
    button { background: #f4f6f9; color: #14171c; border-color: #d7dae0; }
  }
</style>
</head>
<body>
  <h1>ContextVault</h1>
  <p class="sub" id="where">…</p>

  <div class="row">
    <label for="captureEnabled">Auto-capture
      <span class="note">Save conversations to your local archive</span>
    </label>
    <input type="checkbox" id="captureEnabled">
  </div>

  <div id="platforms"></div>

  <button type="button" class="primary" id="capture-now">Capture this chat now</button>
  <button type="button" id="open-options">Settings</button>
  <button type="button" id="open-app">Open ContextVault</button>

  <p id="status" role="status"></p>

  <script src="lib/context.js"></script>
  <script src="lib/platforms.js"></script>
  <script src="popup.js"></script>
</body>
</html>
